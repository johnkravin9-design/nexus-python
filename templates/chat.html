<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with {{ other_user.username }} - Nexus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .chat-container {
            height: 80vh;
            display: flex;
            flex-direction: column;
        }
        .messages-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .message {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 18px;
            margin-bottom: 10px;
        }
        .own-message {
            background: #007bff;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 5px;
        }
        .other-message {
            background: #f1f1f1;
            color: #333;
            margin-right: auto;
            border-bottom-left-radius: 5px;
        }
        .typing-indicator {
            font-style: italic;
            color: #666;
            padding: 5px 10px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('dashboard') }}">Nexus Social</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a>
                <a class="nav-link" href="{{ url_for('messages') }}">Messages</a>
                <a class="nav-link" href="{{ url_for('profile') }}">Profile</a>
                <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="chat-container">
            <div class="d-flex align-items-center mb-3">
                <div class="user-avatar me-3" style="width: 40px; height: 40px; border-radius: 50%; background: #007bff; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold;">
                    {{ other_user.username[0].upper() }}
                </div>
                <div>
                    <h4 class="mb-0">Chat with {{ other_user.username }}</h4>
                </div>
            </div>

            <div class="messages-container" id="messages-container">
                <!-- Messages will be loaded here -->
                <div class="text-center text-muted">Loading messages...</div>
            </div>

            <div class="typing-indicators" id="typing-indicators">
                <!-- Typing indicators will appear here -->
            </div>

            <div class="message-input-container p-3 border-top">
                <div class="input-group">
                    <input type="text" class="form-control" id="message-input" placeholder="Type a message...">
                    <button class="btn btn-primary" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script>
        const socket = io();
        const chatId = {{ chat.id }};
        
        // Join the chat room
        socket.emit('join_chat', { chat_id: chatId });
        
        // Load messages
        loadMessages();
        
        function loadMessages() {
            fetch(`/api/chats/${chatId}/messages`)
                .then(response => response.json())
                .then(messages => {
                    const container = document.getElementById('messages-container');
                    container.innerHTML = '';
                    
                    messages.forEach(message => {
                        addMessageToChat(message);
                    });
                })
                .catch(error => {
                    console.error('Error loading messages:', error);
                });
        }
        
        function addMessageToChat(message) {
            const container = document.getElementById('messages-container');
            const isOwnMessage = message.sender_id === {{ session['user_id'] }};
            
            const messageElement = document.createElement('div');
            messageElement.className = `message ${isOwnMessage ? 'own-message' : 'other-message'}`;
            messageElement.innerHTML = `
                <div class="message-content">${message.content}</div>
                <small class="message-time">${new Date(message.timestamp).toLocaleTimeString()}</small>
            `;
            
            container.appendChild(messageElement);
            container.scrollTop = container.scrollHeight;
        }
        
        function sendMessage() {
            const input = document.getElementById('message-input');
            const content = input.value.trim();
            
            if (content) {
                socket.emit('send_message', {
                    content: content,
                    chat_id: chatId
                });
                input.value = '';
            }
        }
        
        // Socket event listeners
        socket.on('new_message', function(data) {
            addMessageToChat(data);
        });
        
        // Enter key to send message
        document.getElementById('message-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
